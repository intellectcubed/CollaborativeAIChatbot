<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay tool</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 22rem 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  aside { border-right: 1px solid #ccc; padding: 1rem; overflow: auto; }
  main { padding: 1rem; overflow: auto; }
  label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
  select, input, textarea, button { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem; }
  button { margin-top: .8rem; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 1rem 0 0; }
  li { padding: .4rem; border-bottom: 1px solid #eee; cursor: pointer; }
  li:hover, li.sel { background: #eef; }
  .status { color: #555; font-size: 12px; }
  pre { background: #f6f6f6; padding: .6rem; overflow: auto; }
  .step { border: 1px solid #ddd; border-radius: 6px; margin: .6rem 0; padding: .5rem; }
  .err { color: #b00; }
  button.lab { width: auto; margin: 0 0 0 .5rem; padding: .1rem .5rem; font-size: 12px; }
  dialog { width: 96vw; height: 94vh; max-width: none; max-height: none; box-sizing: border-box; overflow: auto; padding: 1rem 1.5rem; }
  dialog table { border-collapse: collapse; width: 100%; font-size: 12px; }
  dialog td, dialog th { border-bottom: 1px solid #eee; padding: .2rem .4rem; text-align: left; vertical-align: top; }
  dialog .scroll { max-height: 18rem; overflow: auto; margin-top: .4rem; }
  dialog tr.changed { background: #fff6e0; }
  .v-pass { color: #080; } .v-fail, .v-miss, .v-error { color: #b00; font-weight: 600; } .v-extra { color: #a60; } .v-skipped { color: #777; }
  dialog .responses { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  dialog .responses pre { min-height: 8rem; margin-top: .2rem; }
  @media (max-width: 800px) { dialog .responses { grid-template-columns: 1fr; } }
  dialog textarea { font: 12px ui-monospace, monospace; }
  dialog .row button { width: auto; margin-right: .5rem; padding: .4rem 1rem; }
  dialog pre { white-space: pre-wrap; }
  #banner { grid-column: 1 / -1; color: #c00; font-weight: 700; padding: .5rem 1rem; border-bottom: 2px solid #c00; }
</style>
</head>
<body>
<div id="banner">Checking agent settings...</div>
<aside>
  <h3>Post a message</h3>
  <label for="sender">From</label><select id="sender"></select>
  <label for="when">Sent at (New York time)</label><input id="when" type="datetime-local">
  <label for="text">Message</label><textarea id="text" rows="4"></textarea>
  <button id="send">Send to message processor</button>
  <div id="result" class="status"></div>
  <h3>Traces</h3>
  <ul id="traces"></ul>
</aside>
<main><h3>Trace <a href="/outbox" target="replies" style="font-size:12px;font-weight:400">pop out replies</a></h3><div id="detail">Select a trace.</div></main>
<dialog id="lab">
  <h3 id="labTitle"></h3>
  <div id="labMeta" class="status"></div>
  <details><summary>As sent in this trace (read-only)</summary><pre id="labSent"></pre></details>
  <details><summary>Response schema (read-only, from the prompt's schema.json)</summary><pre id="labSchema"></pre></details>
  <label for="labSystem">System prompt</label><textarea id="labSystem" rows="12"></textarea>
  <label for="labUser">User message template <span class="status">fields: {message_time} {sender} {message} {dates} {schedule}</span></label>
  <textarea id="labUser" rows="4"></textarea>
  <label>User message for this trace (what Send will use)</label><pre id="labRendered"></pre>
  <div class="row">
    <button id="labSend">Send</button><button id="labAi" title="AI-assisted prompt refinement" aria-label="AI-assisted prompt refinement">✨</button>
    <button id="labEvalBtn" title="Score the system prompt above against the labeled examples in test_cases/">Run test cases</button>
    <button id="labSave">Save to prompt files</button>
    <button id="labReset">Reset to saved</button><button id="labClose">Close</button>
  </div>
  <div id="labEval" class="step" hidden><b>Labeled examples</b> <span id="labEvalStatus" class="status"></span>
    <div id="labEvalBody"></div></div>
  <div id="labAiPanel" class="step" hidden>
    <label for="labHints">Provide hints to the LLM on how this should be fixed or what was observed</label>
    <textarea id="labHints" rows="3"></textarea>
    <label style="font-weight:400"><input id="labAiTest" type="checkbox" checked style="width:auto"> Also test the suggestion against the labeled examples in test_cases/ (about 30 extra model calls, a cent or two)</label>
    <div class="row" style="margin-top:.5rem">
      <button id="labAiGo">Suggest</button><button id="labAiCancel">Cancel</button>
      <button id="labAiUndo" hidden>Undo accepted suggestion</button>
      <span id="labAiStatus" class="status"></span>
    </div>
    <div id="labAiResult" hidden>
      <label>What the model changed and why</label><pre id="labAiWhy"></pre>
      <label>Suggested system prompt</label><pre id="labAiProposed"></pre>
      <div id="labAiEval"><span id="labAiEvalStatus" class="status"></span><div id="labAiEvalBody"></div></div>
      <div class="row"><button id="labAiAccept">Accept</button><button id="labAiReject">Reject</button></div>
    </div>
  </div>
  <div class="responses">
    <div><label>Original response <span id="labOrigMeta" class="status"></span></label><pre id="labOriginal"></pre></div>
    <div><label>New response <span id="labStatus" class="status"></span></label><pre id="labResult"></pre></div>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
let selected = null;
let members = [];
let currentTrace = null;
// Raw text never reaches the server; this browser remembers what it sent so panel 0 can show it.
const sentKey = "replay.sent";
function sentText(id) { try { return (JSON.parse(localStorage.getItem(sentKey)) || {})[id]; } catch (e) { return undefined; } }
function rememberText(id, text) {
  try { const m = JSON.parse(localStorage.getItem(sentKey)) || {}; m[id] = text; localStorage.setItem(sentKey, JSON.stringify(m)); } catch (e) {}
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }

async function loadStatus() {
  const s = await api("/api/status");
  const calendar = !s.agent_reported ? "agent has not reported (is it running?)"
    : s.calendar_url ? `${s.calendar_url} (port ${s.calendar_port ?? "default"})` : "OFF (no CALENDAR_BASE_URL)";
  $("banner").textContent = `CALENDAR_ALLOW_WRITES: ${s.allow_writes ? "ON" : "OFF"} | policy mode: ${s.policy_mode}` +
    ` | ${s.writing ? "WRITES ARE LIVE" : "dry run, nothing is written"} | calendar: ${calendar}` +
    ` | replies: ${Object.entries(s.routes).map(([k, v]) => k + "→" + v).join(", ")} | announce_results: ${s.announce_results ? "ON" : "OFF"}`;
}
async function loadMembers() {
  members = await api("/api/members");
  $("sender").innerHTML = members.map(m => `<option value="${esc(m.sender_id)}">${esc(m.name)} · ${esc(m.member)} · squad ${esc(m.squad)}</option>`).join("");
}
let drawnList = "";
async function loadTraces() {
  const traces = await api("/api/traces");
  const html = traces.map(t =>
    `<li data-id="${esc(t.trace_id)}" class="${t.trace_id === selected ? "sel" : ""}">${esc(t.sent_at || "")}<br><span class="status">${esc(t.status)} · ${esc(t.source)}</span></li>`).join("");
  if (html === drawnList) return;  // unchanged: leave the list alone
  drawnList = html; $("traces").innerHTML = html;
  document.querySelectorAll("#traces li").forEach(li => li.onclick = () => { selected = li.dataset.id; fillForm(traces.find(t => t.trace_id === selected)); loadTraces(); loadDetail(); });
}
// The stored step has only the pseudonym; add the name, squad and body this browser knows about.
function inboundView(o, who, text) {
  const out = {};
  for (const [k, v] of Object.entries(o)) {
    if (k === "member" && who) { out.member = `${who.name} - ${who.member}`; out.squad = Number.isNaN(+who.squad) ? who.squad : +who.squad; }
    else out[k] = v;
    if (k === "text_length" && text !== undefined) out.body = text;
  }
  return out;
}
// Clicking a trace loads it into the form so it can be sent again.
function fillForm(t) {
  if (!t) return;
  if (members.some(m => m.sender_id === t.sender_id)) $("sender").value = t.sender_id;
  if (t.sent_at) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      .formatToParts(new Date(t.sent_at)).map(x => [x.type, x.value]));
    $("when").value = `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }
  $("text").value = sentText(t.trace_id) ?? "";
}
function repliesPanel(rows) {
  if (!rows.length) return "";
  return `<div class="step"><b>Replies</b>` + rows.map(r => {
    const who = members.find(m => m.member === r.to_member);
    return `<div style="margin:.4rem 0"><span class="status">${esc(r.kind)} · to ${who ? esc(who.name) + " · " : ""}${esc(r.to_member || "unknown")}` +
      ` · ${esc(r.channel || "-")} · ${esc(r.status)}${r.error ? " · " + esc(r.error) : ""}</span><pre>${esc(r.text)}</pre></div>`;
  }).join("") + `</div>`;
}
async function loadDetail() {
  if (!selected) return;
  const t = await api("/api/traces/" + encodeURIComponent(selected));
  const replies = await api("/api/traces/" + encodeURIComponent(selected) + "/outbox");
  const who = members.find(m => m.sender_id === t.sender_id);
  const text = sentText(t.trace_id);
  const msg = `<div class="step"><b>0. message</b>` +
    `<div>Sent at: ${esc(t.sent_at || "")}</div>` +
    `<div>Member: ${who ? esc(who.name) + " · " + esc(who.member) + " · squad " + esc(who.squad) : esc(t.sender_id || "unknown")}</div>` +
    `<div>Message (unredacted):</div><pre>${text === undefined ? "(not available: not sent from this browser)" : esc(text)}</pre></div>`;
  const html = `<div class="status">${esc(t.trace_id)} · ${esc(t.status)} · sent ${esc(t.sent_at)}</div>` + msg +
    t.steps.map(s => `<div class="step"><b>${s.seq}. ${esc(s.name)}</b> <span class="status">${s.duration_ms} ms</span>` +
      (s.name.startsWith("llm:") && s.input ? `<button class="lab" data-seq="${s.seq}">View / edit prompt</button>` : "") +
      (s.error ? ` <span class="err">error: ${esc(s.error)}</span>` : "") +
      (s.input ? `<pre>input: ${esc(JSON.stringify(s.input, null, 2))}</pre>` : "") +
      (s.output ? `<pre>output: ${esc(JSON.stringify(s.name === "inbound" ? inboundView(s.output, who, text) : s.output, null, 2))}</pre>` : "") + `</div>`).join("") + repliesPanel(replies);
  currentTrace = t;
  // The page refreshes every 2 seconds. Redrawing destroys the DOM nodes, which clears any text the user is
  // selecting to copy, so redraw only when something changed and nothing in the panel is selected.
  const switched = selected !== drawnTrace;
  if (!switched && (html === drawnHtml || selectionIn($("detail")))) return;
  $("detail").innerHTML = html; drawnHtml = html; drawnTrace = selected;
  document.querySelectorAll("button.lab").forEach(b => b.onclick = () => openLab(+b.dataset.seq));
}
let drawnHtml = "", drawnTrace = null;
function selectionIn(el) { const s = getSelection(); return !!s && !s.isCollapsed && el.contains(s.anchorNode); }

// ---- prompt editor: look at what was sent, edit it, try it, save it
let lab = null;  // {name, step, saved}
function pretty(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; } }
const labBody = () => ({ system: $("labSystem").value, user_template: $("labUser").value, trace_id: lab.step.trace_id,
                         model: lab.step.input.model, max_tokens: lab.step.input.max_tokens });
async function labCall(path, method, body) {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
async function labRender() {
  try { $("labRendered").textContent = (await labCall(`/api/prompts/${lab.name}/render`, "POST", labBody())).user; }
  catch (e) { $("labRendered").textContent = "cannot render: " + e.message; }
}
function labFill(p) {
  lab.saved = p;
  $("labSystem").value = p.system; $("labUser").value = p.user_template; $("labSchema").textContent = JSON.stringify(p.schema, null, 2);
  const sent = lab.step.input.prompt_version;
  $("labMeta").textContent = `model ${lab.step.input.model} · max_tokens ${lab.step.input.max_tokens} · saved version ${p.version}` +
    (sent === p.version ? "" : ` · this call used version ${sent}: the fields below hold the saved files, the text actually sent is in the section above`);
  labRender();
}
async function openLab(seq) {
  const step = { ...currentTrace.steps.find(x => x.seq === seq), trace_id: currentTrace.trace_id };
  lab = { name: step.name.slice(4), step };
  $("labTitle").textContent = `${step.name} (step ${seq})`;
  $("labSent").textContent = "SYSTEM\n" + step.input.system + "\n\nUSER\n" + step.input.user;
  $("labResult").textContent = ""; $("labStatus").textContent = ""; aiReset();
  const out = step.output;  // the response this call actually got
  $("labOriginal").textContent = out ? pretty(out.response) : "(this call failed, so there was no response)";
  $("labOrigMeta").textContent = out ? `${out.stop_reason} · ${out.input_tokens} in / ${out.output_tokens} out · $${out.cost_usd} · ${out.latency_ms} ms` : "";
  try { labFill(await api("/api/prompts/" + lab.name)); } catch (e) { $("labStatus").textContent = "cannot load prompt: " + e.message; }
  $("lab").showModal();
}
let labTimer;
$("labUser").oninput = () => { clearTimeout(labTimer); labTimer = setTimeout(labRender, 400); };
$("labClose").onclick = () => $("lab").close();
$("labReset").onclick = () => labFill(lab.saved);
$("labSend").onclick = async () => {
  $("labSend").disabled = true; $("labStatus").textContent = "sending..."; $("labResult").textContent = "";
  try {
    const r = await labCall(`/api/prompts/${lab.name}/try`, "POST", labBody());
    if (r.error) { $("labStatus").textContent = "model call failed"; $("labResult").textContent = r.error; return; }
    $("labStatus").textContent = `${r.model} · ${r.stop_reason} · ${r.input_tokens} in / ${r.output_tokens} out · $${r.cost_usd} · ${r.latency_ms} ms`;
    $("labResult").textContent = pretty(r.text);
  } catch (e) { $("labStatus").textContent = "failed: " + e.message; }
  finally { $("labSend").disabled = false; }
};
// ---- labeled examples: score one system prompt, or compare two
const evalBody = systems => ({ user_template: $("labUser").value, model: lab.step.input.model, max_tokens: lab.step.input.max_tokens, systems });
function summaryText(label, s) {
  const c = s.counts, extra = ["fail", "miss", "extra", "error"].filter(k => c[k]).map(k => `${c[k]} ${k === "miss" ? "missed schedule changes" : k === "extra" ? "needlessly passed on" : k}`);
  return `${label}: ${s.passed}/${s.scored} passed` + (extra.length ? ` (${extra.join(", ")})` : "") + (s.dates_scored || s.dates_none ? ` · dates right ${s.dates_ok}/${s.dates_scored} when named (${s.dates_none} named none)` : "") + ` · $${s.cost_usd}`;
}
function cell(r) { return r ? `<span class="v-${r.verdict}">${esc(r.verdict)}</span> <span class="status">${esc(r.detail || "")}</span>` : ""; }
function renderEval(ev, status, body) {
  const [a, b] = ev.labels;
  status.textContent = ev.labels.map(l => summaryText(l, ev.summary[l])).join("  |  ") + (ev.skipped ? `  |  ${ev.skipped} skipped by the PII filter` : "");
  let regress = [], better = [];
  const rows = ev.cases.map(c => {
    const x = c.results[a], y = b && c.results[b];
    const changed = y && x && (x.verdict === "pass") !== (y.verdict === "pass");
    if (changed) (x.verdict === "pass" ? regress : better).push(c.id);
    return { c, x, y, changed };
  }).sort((p, q) => (q.changed - p.changed));
  const note = b ? `<div><b class="${regress.length ? "v-fail" : "v-pass"}">${regress.length} got worse</b> (${regress.join(", ") || "none"}) · <b class="v-pass">${better.length} got better</b> (${better.join(", ") || "none"})</div>` : "";
  body.innerHTML = note + `<div class="scroll"><table><tr><th>#</th><th>expected</th><th>message (after the PII filter)</th>${ev.labels.map(l => `<th>${esc(l)}</th>`).join("")}</tr>` +
    rows.map(({ c, changed }) => `<tr class="${changed ? "changed" : ""}"><td>${esc(c.id)}</td><td>${esc(c.expected)}</td><td>${c.text === null ? `<i>${esc(c.skipped)}</i>` : esc(c.text.slice(0, 110))}</td>` +
      ev.labels.map(l => `<td>${c.skipped ? "" : cell(c.results[l])}</td>`).join("") + `</tr>`).join("") + `</table></div>`;
}
async function runEval(systems, status, body) {
  status.textContent = "testing against the labeled examples...";
  body.innerHTML = "";
  try { renderEval(await labCall(`/api/prompts/${lab.name}/evaluate`, "POST", evalBody(systems)), status, body); }
  catch (e) { status.textContent = "could not run the labeled examples: " + e.message; }
}
$("labEvalBtn").onclick = async () => {
  $("labEval").hidden = false; $("labEvalBtn").disabled = true;
  await runEval([{ label: "this prompt", system: $("labSystem").value }], $("labEvalStatus"), $("labEvalBody"));
  $("labEvalBtn").disabled = false;
};

// AI-assisted refinement: ask for a better system prompt, then accept or reject it
let aiProposed = null, aiBefore = null;
function aiReset() {
  $("labEval").hidden = true; $("labEvalBody").innerHTML = ""; $("labEvalStatus").textContent = "";
  $("labAiEvalBody").innerHTML = ""; $("labAiEvalStatus").textContent = "";
  $("labAiPanel").hidden = true; $("labAiResult").hidden = true; $("labAiUndo").hidden = true;
  $("labHints").value = ""; $("labAiStatus").textContent = ""; aiProposed = aiBefore = null;
}
$("labAi").onclick = () => { $("labAiPanel").hidden = !$("labAiPanel").hidden; if (!$("labAiPanel").hidden) $("labHints").focus(); };
$("labAiCancel").onclick = () => { $("labAiPanel").hidden = true; $("labAiResult").hidden = true; };
$("labAiGo").onclick = async () => {
  $("labAiGo").disabled = true; $("labAiStatus").textContent = "asking..."; $("labAiResult").hidden = true;
  const latest = $("labResult").textContent.trim() ? $("labResult").textContent : $("labOriginal").textContent;  // the newest response shown
  try {
    const r = await labCall(`/api/prompts/${lab.name}/refine`, "POST", { system: $("labSystem").value,
      user: $("labRendered").textContent, response: latest, hints: $("labHints").value, model: lab.step.input.model });
    if (r.error) { $("labAiStatus").textContent = "model call failed: " + r.error; return; }
    aiProposed = r.system_prompt;
    $("labAiWhy").textContent = r.explanation; $("labAiProposed").textContent = r.system_prompt;
    $("labAiStatus").textContent = `${r.model} · ${r.input_tokens} in / ${r.output_tokens} out · $${r.cost_usd} · ${r.latency_ms} ms`;
    $("labAiResult").hidden = false;
    $("labAiEvalBody").innerHTML = ""; $("labAiEvalStatus").textContent = "";
    if ($("labAiTest").checked) {
      const proposed = r.system_prompt;  // read the box now: the user may accept before the run finishes
      await runEval([{ label: "current", system: $("labSystem").value }, { label: "suggested", system: proposed }],
                    $("labAiEvalStatus"), $("labAiEvalBody"));
    }
  } catch (e) { $("labAiStatus").textContent = "failed: " + e.message; }
  finally { $("labAiGo").disabled = false; }
};
$("labAiAccept").onclick = () => {
  aiBefore = $("labSystem").value; $("labSystem").value = aiProposed;
  $("labAiResult").hidden = true; $("labAiUndo").hidden = false;
  $("labAiStatus").textContent = "accepted: the system prompt above is replaced (not saved yet). Press Send to try it.";
};
$("labAiReject").onclick = () => { $("labAiResult").hidden = true; $("labAiStatus").textContent = "rejected: the system prompt is unchanged"; };
$("labAiUndo").onclick = () => {
  $("labSystem").value = aiBefore; $("labAiUndo").hidden = true; $("labAiStatus").textContent = "restored the system prompt from before the suggestion";
};
$("labSave").onclick = async () => {
  if (!confirm(`Save to prompts/${lab.name}/? Every later message, including live GroupMe traffic, will use it.`)) return;
  try {
    const r = await labCall(`/api/prompts/${lab.name}`, "PUT", { system: $("labSystem").value, user_template: $("labUser").value });
    labFill(await api("/api/prompts/" + lab.name)); $("labStatus").textContent = `saved, new version ${r.version}`;
  } catch (e) { $("labStatus").textContent = "save failed: " + e.message; }
};

$("send").onclick = async () => {
  if ($("send").disabled) return;  // one click, one message
  $("send").disabled = true;
  const body = { sender_id: $("sender").value, text: $("text").value };
  if ($("when").value) body.sent_at = $("when").value;
  try {
    const r = await api("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    $("result").textContent = "processor: " + r.status;
    selected = r.trace_id; rememberText(r.trace_id, body.text); $("text").value = "";
    loadTraces(); loadDetail();
  } catch (e) { $("result").textContent = "failed: " + e.message; }
  finally { $("send").disabled = false; }
};
loadMembers(); loadTraces(); loadStatus();
setInterval(() => { loadTraces(); loadDetail(); loadStatus(); }, 2000);
</script>
</body>
</html>
